name: CI
on:
  push:
    branches: [main, feature/outlook-deep-link-converter]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build-test-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npm run lint
      - run: npm test
      - run: xvfb-run -a npm run test:integration
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: outlook-email-links-vsix
          path: outlook-email-links.vsix
          if-no-files-found: error
